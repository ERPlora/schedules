# Guest WASM handler para el módulo `schedules` (Tier 2). Compila a wasm32 (cdylib)
# y exporta `is_open`, `bulk_create_special_days`, `set_business_hours`,
# `create_special_day` y `create_override` — el motor "¿está abierto?" y la
# validación de horas pre-INSERT especificados en WASM-TODO.md §1/§3/§4.
# Crate independiente del workspace (el `[workspace]` vacío lo desacopla);
# extism-pdk solo compila a wasm.
#
# Build:  cargo build --target wasm32-unknown-unknown --release --features guest
# Output: target/wasm32-unknown-unknown/release/schedules_handler.wasm → dist/handler.wasm
[package]
name = "schedules-handler"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
guest = ["dep:extism-pdk"]

[dependencies]
# El crate de contrato host↔guest vive en el workspace Rust del hub.
erplora-guest-sdk = { path = "../../../../hub/crates/guest-sdk" }
extism-pdk = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Sin lto/strip: interfieren con los wrappers de export de extism-pdk.
[profile.release]
opt-level = "s"

[workspace]
